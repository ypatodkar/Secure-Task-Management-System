<div class="bg-white p-6 rounded-lg shadow-lg mb-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">{{ taskToEdit ? 'Edit Task' : 'Create New Task' }}</h2>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Hidden ID for editing -->
      <input type="hidden" formControlName="id" />
  
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          [ngClass]="{'border-red-300': title?.invalid && (title?.dirty || title?.touched)}"
          placeholder="Enter task title"
        />
        <div *ngIf="title?.invalid && (title?.dirty || title?.touched)" class="mt-1 text-sm text-red-600">
          <div *ngIf="title?.errors?.['required']">Title is required</div>
          <div *ngIf="title?.errors?.['minlength']">Title must be at least 3 characters</div>
          <div *ngIf="title?.errors?.['maxlength']">Title cannot exceed 100 characters</div>
        </div>
      </div>
  
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          [ngClass]="{'border-red-300': description?.invalid && (description?.dirty || description?.touched)}"
          placeholder="Enter task description"
        ></textarea>
        <div *ngIf="description?.invalid && (description?.dirty || description?.touched)" class="mt-1 text-sm text-red-600">
          <div *ngIf="description?.errors?.['maxlength']">Description cannot exceed 500 characters</div>
        </div>
      </div>
  
      <div>
        <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
        <select
          id="status"
          formControlName="status"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
        >
          <option [value]="TaskStatus.OPEN">Open</option>
          <option [value]="TaskStatus.IN_PROGRESS">In Progress</option>
          <option [value]="TaskStatus.DONE">Done</option>
          <option [value]="TaskStatus.ARCHIVED">Archived</option>
        </select>
      </div>
  
      <div>
        <label for="assigneeId" class="block text-sm font-medium text-gray-700">Assignee ID (Optional)</label>
        <input
          id="assigneeId"
          type="text"
          formControlName="assigneeId"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Enter assignee ID"
        />
      </div>
  
      <div class="flex justify-end space-x-3 pt-4">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!taskForm.valid"
          class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
