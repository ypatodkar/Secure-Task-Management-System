<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Tasks</h1>
    <button
      (click)="onEdit(null)"
      class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors"
    >
      Add New Task
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>

  <!-- Task List -->
  <div *ngIf="!isLoading && !error" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <app-task-card
      *ngFor="let task of tasks"
      [task]="task"
      (edit)="onEdit(task)"
      (delete)="onDelete(task.id)"
      (statusChange)="onChangeStatus($event)"
    ></app-task-card>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && !error && tasks.length === 0" class="text-center py-8">
    <p class="text-gray-500">No tasks found. Create your first task!</p>
  </div>

  <!-- Modal Backdrop -->
  <div *ngIf="showEditForm" 
       class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
       (click)="onCancelEdit()">
    <!-- Modal Content -->
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4" (click)="$event.stopPropagation()">
      <div class="p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-semibold text-gray-800">
            {{ taskToEdit ? 'Edit Task' : 'Create New Task' }}
          </h3>
          <button (click)="onCancelEdit()" 
                  class="text-gray-500 hover:text-gray-700 focus:outline-none">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <app-task-form
          [taskToEdit]="taskToEdit"
          (saveTask)="onSaveTask($event)"
          (cancel)="onCancelEdit()"
        ></app-task-form>
      </div>
    </div>
  </div>
</div>
