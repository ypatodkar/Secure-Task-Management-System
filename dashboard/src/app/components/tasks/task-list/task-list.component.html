<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Tasks Board</h1>
    <!-- Show button only if user has permission -->
    <button *ngIf="canCreateTasks$ | async"
      (click)="onEdit(null)"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-all duration-200">
      + Add New Task
    </button>
  </div>
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-600"></div>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
    <p class="font-bold">Error</p>
    <p>{{ error }}</p>
  </div>

  <!-- Kanban Board Columns -->
  <div *ngIf="!isLoading && !error" class="grid grid-cols-1 md:grid-cols-3 gap-6" cdkDropListGroup>
    
    <!-- "To Do" Column -->
    <div class="bg-gray-100 rounded-lg p-4 shadow-inner">
      <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b-2 border-gray-300 pb-2">To Do</h2>
      <div 
        cdkDropList 
        [id]="TaskStatus.OPEN"
        [cdkDropListData]="todoTasks"
        (cdkDropListDropped)="drop($event)"
        class="min-h-[300px] space-y-4">
        <app-task-card 
          *ngFor="let task of todoTasks"
          [task]="task"
          (edit)="onEdit(task)"
          (delete)="onDelete(task.id)"
          (statusChange)="onChangeStatus($event)"
          cdkDrag>
        </app-task-card>
      </div>
    </div>

    <!-- "In Progress" Column -->
    <div class="bg-gray-100 rounded-lg p-4 shadow-inner">
      <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b-2 border-gray-300 pb-2">In Progress</h2>
      <div 
        cdkDropList
        [id]="TaskStatus.IN_PROGRESS"
        [cdkDropListData]="inProgressTasks"
        (cdkDropListDropped)="drop($event)"
        class="min-h-[300px] space-y-4">
        <app-task-card 
          *ngFor="let task of inProgressTasks"
          [task]="task"
          (edit)="onEdit(task)"
          (delete)="onDelete(task.id)"
          (statusChange)="onChangeStatus($event)"
          cdkDrag>
        </app-task-card>
      </div>
    </div>

    <!-- "Done" Column -->
    <div class="bg-gray-100 rounded-lg p-4 shadow-inner">
      <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b-2 border-gray-300 pb-2">Done</h2>
      <div 
        cdkDropList
        [id]="TaskStatus.DONE"
        [cdkDropListData]="doneTasks"
        (cdkDropListDropped)="drop($event)"
        class="min-h-[300px] space-y-4">
        <app-task-card 
          *ngFor="let task of doneTasks"
          [task]="task"
          (edit)="onEdit(task)"
          (delete)="onDelete(task.id)"
          (statusChange)="onChangeStatus($event)"
          cdkDrag>
        </app-task-card>
      </div>
    </div>
  </div>

  <!-- Empty State (if all lists are empty) -->
  <div *ngIf="!isLoading && !error && todoTasks.length === 0 && inProgressTasks.length === 0 && doneTasks.length === 0" class="text-center py-12">
    <p class="text-gray-500 text-lg">No tasks found. Create your first task!</p>
  </div>

  <!-- Modal remains the same -->
  <div *ngIf="showEditForm" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" (click)="onCancelEdit()">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4" (click)="$event.stopPropagation()">
        <!-- Modal content here -->
        <app-task-form [taskToEdit]="taskToEdit" (saveTask)="onSaveTask($event)" (cancel)="onCancelEdit()"></app-task-form>
    </div>
  </div>
</div>
