<!-- The cdkDrag directive makes this entire element draggable -->
<div cdkDrag class="bg-white p-4 rounded-lg shadow-md mb-4 border border-gray-200 flex flex-col hover:shadow-lg transition-shadow duration-200">
  
  <!-- This is an empty placeholder that will appear in the source list while dragging -->
  <div *cdkDragPlaceholder class="h-24 bg-gray-200 border-2 border-dashed border-gray-400 rounded-lg"></div>

  <!-- Card Content -->
  <div class="flex justify-between items-start mb-2">
    <h3 class="text-xl font-semibold text-gray-800 flex-grow">{{ task.title }}</h3>
    <!-- This handle is the only part that will initiate a drag -->
    <div cdkDragHandle class="cursor-move p-2 text-gray-400 hover:text-gray-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </svg>
    </div>
  </div>
  
  <p class="text-gray-600 mb-3 flex-grow">{{ task.description || 'No description provided.' }}</p>
  
  <div class="flex justify-between items-center text-sm text-gray-500">
    <span [ngClass]="{
      'px-2 py-1 rounded-full text-xs font-semibold': true,
      'bg-yellow-100 text-yellow-800': task.status === TaskStatus.OPEN,
      'bg-blue-100 text-blue-800': task.status === TaskStatus.IN_PROGRESS,
      'bg-green-100 text-green-800': task.status === TaskStatus.DONE
    }">{{ task.status }}</span>
    <div class="flex space-x-1">
      <button (click)="onEdit()" class="p-1 text-gray-500 hover:text-blue-600 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.732 3.732z"></path></svg>
      </button>
      <button (click)="onDelete()" class="p-1 text-gray-500 hover:text-red-600 rounded-full focus:outline-none focus:ring-2 focus:ring-red-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
      </button>
    </div>
  </div>
</div>
