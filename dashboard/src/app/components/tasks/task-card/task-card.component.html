<div class="bg-white p-4 rounded-lg shadow-md mb-4 border border-gray-200 hover:border-indigo-400 transition-all duration-200 ease-in-out">
    <div class="flex justify-between items-start mb-2">
      <h3 class="text-xl font-semibold text-gray-800">{{ task.title }}</h3>
      <div class="flex space-x-2">
        <button (click)="onEdit()" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md text-sm transition-colors duration-200">Edit</button>
        <button (click)="onDelete()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md text-sm transition-colors duration-200">Delete</button>
      </div>
    </div>
    <p class="text-gray-600 mb-3">{{ task.description || 'No description provided.' }}</p>
  
    <div class="flex items-center text-sm text-gray-500 mb-3">
      <span class="mr-4">Status: <span [ngClass]="{
        'px-2 py-1 rounded-full text-xs font-semibold': true,
        'bg-yellow-100 text-yellow-800': task.status === TaskStatus.OPEN,
        'bg-blue-100 text-blue-800': task.status === TaskStatus.IN_PROGRESS,
        'bg-green-100 text-green-800': task.status === TaskStatus.DONE,
        'bg-gray-200 text-gray-700': task.status === TaskStatus.ARCHIVED
      }">{{ task.status | uppercase }}</span></span>
      <span class="mr-4" *ngIf="task.assignee">Assignee: <span class="font-medium text-gray-700">{{ task.assignee.firstName }} {{ task.assignee.lastName }}</span></span>
      <span *ngIf="task.creator">Creator: <span class="font-medium text-gray-700">{{ task.creator.firstName }} {{ task.creator.lastName }}</span></span>
    </div>
  
    <div class="flex justify-end space-x-2">
      <button (click)="onChangeStatus(TaskStatus.OPEN)" [disabled]="task.status === TaskStatus.OPEN" class="bg-yellow-200 hover:bg-yellow-300 text-yellow-800 px-3 py-1 rounded-md text-sm disabled:opacity-50">Open</button>
      <button (click)="onChangeStatus(TaskStatus.IN_PROGRESS)" [disabled]="task.status === TaskStatus.IN_PROGRESS" class="bg-blue-200 hover:bg-blue-300 text-blue-800 px-3 py-1 rounded-md text-sm disabled:opacity-50">In Progress</button>
      <button (click)="onChangeStatus(TaskStatus.DONE)" [disabled]="task.status === TaskStatus.DONE" class="bg-green-200 hover:bg-green-300 text-green-800 px-3 py-1 rounded-md text-sm disabled:opacity-50">Done</button>
      <button (click)="onChangeStatus(TaskStatus.ARCHIVED)" [disabled]="task.status === TaskStatus.ARCHIVED" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-3 py-1 rounded-md text-sm disabled:opacity-50">Archive</button>
    </div>
  </div>
